# ai-job-agent (chapter11) 파이프라인을 GitHub Actions에서 실행하는 워크플로.
#
# 트리거는 2가지입니다:
#   1) workflow_dispatch(수동 실행) — 기본은 dry-run(실제 Gemini 호출·Slack/Gmail 발송 없음).
#      `live` 입력을 true로 주면 그때만 실제 호출/발송을 시도합니다.
#   2) schedule(자동 정기 실행) — 매주 금요일 09:10 KST, 항상 live로 동작합니다(아래 참고).
#
# [2026-10-05, 사용자 지시로 활성화] schedule(자동 정기 실행) — 매주 금요일 09:10 KST(=00:10 UTC,
# cron "10 0 * * 5")에 잡코리아 신규 AI·AX 공고 목록을 Slack·Gmail로 발송합니다. **단, schedule은
# 기본 브랜치(main)에 이 파일이 있어야만 실제로 동작합니다** — main 반영용 PR이 merge되기 전까지는
# 금요일이 되어도 자동 실행되지 않습니다(자세한 내용은 docs/STATUS.md "STEP 18" 섹션 참고).
#
# LinkedIn 공고 입력은 자동 수집이 아니라 여전히 "사용자 수동 입력"입니다 — 이 워크플로는 새로
# 크롤링하지 않고, **이 시점에 GitHub 저장소(main)에 반영되어 있는 `data/processed/`의 레코드**만 읽어
# 정제·분석·보고서·전송을 수행합니다(robots.txt 차단 확인됨, SPEC.md 2장 참고). 즉 새 LinkedIn 공고를
# 포함하려면, 먼저 로컬에서 수동 입력 → 커밋 → main에 반영(push/merge)하는 과정이 선행되어야 합니다.
#
# [2026-10-05 최종 목표 확정] 잡코리아 신규 AI·AX 공고(회사·제목·링크만, 본문 분석·AI 요약 없음)를
# 매주 금요일 09:10 KST에 Slack·Gmail로 받는 것이 최종 목표입니다. 잡코리아 목록 수집은 검색 결과
# **목록 페이지만** 1회 조회하며(상세 페이지 방문 없음), 신규 판별 이력은
# `data/processed/history_jobkorea_ai_ax.csv`에 별도로 쌓입니다(LinkedIn 이력과 분리). **Greenhouse
# 자동 수집 트랙은 같은 날 사용자 지시로 중단되어 이 워크플로가 더 이상 실행하지 않습니다.**
#
# 필요한 GitHub Secrets(실제 발송에만 필요, 이름만 참조하며 값은 여기 어디에도 출력하지 않음):
#   SLACK_WEBHOOK_URL, GMAIL_ADDRESS, GMAIL_APP_PASSWORD, GMAIL_TO_ADDRESS
#   (GEMINI_API_KEY는 LinkedIn 트랙에서 캐시 없는 레코드가 생길 때만 쓰이는 선택 사항이라 필수
#    검증 대상에서 제외했습니다 — 잡코리아 트랙은 Gemini를 전혀 쓰지 않습니다.)
# live로 실행되는데 위 4개 중 하나라도 비어 있으면, 실제 발송을 시도하기 전에 별도 검증 단계에서
# 명확한 오류로 실패합니다(어떤 값이 비어 있는지 "이름만" 출력합니다).

name: ai-job-agent weekly report (chapter11)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "true면 실제 Gemini 호출 + Slack/Gmail 발송(Secrets 필요). false(기본)면 dry-run만 실행."
        required: false
        default: false
        type: boolean
  schedule:
    # 매주 금요일 00:10 UTC = 한국 시간(KST, UTC+9) 금요일 09:10. (2026-10-05 사용자 확인 후 활성화)
    # ⚠️ 기본 브랜치(main)에 이 파일이 있어야만 실제로 매주 실행됩니다.
    - cron: "10 0 * * 5"

permissions:
  contents: write  # live 실행 후 이력 파일(history_linkedin_manual.csv)을 커밋해 복원 가능하게 하려면 필요

defaults:
  run:
    working-directory: chapter11/ai-job-agent

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 실행 모드 결정 (schedule=항상 live, workflow_dispatch=live 입력값 따름)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "이 실행은 schedule(자동 정기 실행)이므로 live 모드로 동작합니다."
          elif [ "${{ inputs.live }}" = "true" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "이 실행은 workflow_dispatch이며 live=true가 지정되어 live 모드로 동작합니다."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "이 실행은 dry-run 모드로 동작합니다(외부 호출·발송 없음)."
          fi

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # 참고: 3.14는 최신 버전이라 ubuntu-latest 러너에 바로 없을 수 있습니다.
          # 실제 Actions 실행에서 이 단계가 실패하면 "3.12" 등으로 낮춰서 다시 시도하세요.

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: GitHub Secrets 4개 검증 (live 모드일 때만 — 값은 출력하지 않고 이름만 확인)
        if: steps.mode.outputs.live == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_ADDRESS: ${{ secrets.GMAIL_TO_ADDRESS }}
        run: |
          missing=""
          [ -z "$SLACK_WEBHOOK_URL" ] && missing="$missing SLACK_WEBHOOK_URL"
          [ -z "$GMAIL_ADDRESS" ] && missing="$missing GMAIL_ADDRESS"
          [ -z "$GMAIL_APP_PASSWORD" ] && missing="$missing GMAIL_APP_PASSWORD"
          [ -z "$GMAIL_TO_ADDRESS" ] && missing="$missing GMAIL_TO_ADDRESS"
          if [ -n "$missing" ]; then
            echo "::error::live 실행에 필요한 GitHub Secrets가 설정되지 않았습니다 (이름만 표시, 값 아님):$missing"
            echo "::error::저장소 Settings > Secrets and variables > Actions 에서 위 이름으로 등록한 뒤 다시 실행하세요."
            exit 1
          fi
          echo "필요한 Secrets 4개 모두 설정되어 있음을 확인했습니다(값은 출력하지 않음). GEMINI_API_KEY는"
          echo "선택 사항이라 이 검증에는 포함하지 않았습니다(잡코리아 트랙은 Gemini를 쓰지 않음)."

      - name: 파이프라인 실행 (schedule=live, workflow_dispatch는 live 입력값에 따라 dry-run/live)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_ADDRESS: ${{ secrets.GMAIL_TO_ADDRESS }}
        run: |
          if [ "${{ steps.mode.outputs.live }}" = "true" ]; then
            echo "LIVE 모드로 실행합니다 (실제 Gemini 호출 + 실제 Slack/Gmail 발송)"
            python main.py --live
          else
            echo "dry-run 모드로 실행합니다 (외부 호출·발송 없음)"
            python main.py
          fi

      - name: 생성된 보고서를 아티팩트로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: chapter11/ai-job-agent/reports/*.md
          if-no-files-found: warn

      - name: 운영 이력 파일 커밋 (live 실행일 때만 — 신규판별 이력을 다음 실행에 남기기 위함)
        if: steps.mode.outputs.live == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/history_linkedin_manual.csv
          # history_jobkorea_ai_ax.csv는 이번 실행에서 신규 후보가 0건이면 아직 생성되지 않았을 수
          # 있으므로, 없으면 건너뛴다(git add가 미존재 경로에서 실패해 이 스텝 전체가 죽는 것을 방지).
          if [ -f data/processed/history_jobkorea_ai_ax.csv ]; then
            git add data/processed/history_jobkorea_ai_ax.csv
          fi
          git diff --cached --quiet || git commit -m "chore(ai-job-agent): update job history [automated]"
          git push
